name: Diagnostics
on: workflow_dispatch
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in "https://cdn.jsdelivr.net/gh/site-ready-app/Strong-Steady@main/docs/cal/exercise-1030.ics" "https://site-ready-app.github.io/Strong-Steady/cal/exercise-1030.ics" "https://raw.githack.com/site-ready-app/Strong-Steady/main/docs/cal/exercise-1030.ics"; do
            H=$(curl -sIL -m 20 "$u" | grep -i -E "^HTTP|^content-type" | tr '\r\n' '  ')
            echo "::notice::$u -> $H"
          done
