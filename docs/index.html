<div class="wrap">
  <div id="shell" hidden>
    <div class="top">
      <div class="brand">Strong &amp; Steady</div>
      <span class="chip" id="chip-streak" title="Days in a row">🔥 0</span>
      <span class="chip" id="chip-rank">Starter</span>
      <button class="chip" id="gear" aria-label="Settings and help">⚙️</button>
    </div>
    <nav class="tabs" id="tabs">
      <button data-tab="today"><span class="i">☀️</span>Today</button>
      <button data-tab="exercise"><span class="i">🤸</span>Exercise</button>
      <button data-tab="journey"><span class="i">🗺️</span>Journey</button>
      <button data-tab="games"><span class="i">🎮</span>Games</button>
      <button data-tab="progress"><span class="i">🏆</span>Progress</button>
    </nav>
    <main id="view"></main>
  </div>
  <main id="full" hidden></main>
</div>
<div id="layer"></div>
<canvas id="confetti" hidden></canvas>
<div id="rescue" hidden style="max-width:520px;margin:40px auto;padding:20px;font-family:system-ui,sans-serif;font-size:20px;text-align:center">
  <p style="font-size:2.5em;margin:0">🌿</p><h2>Strong &amp; Steady didn't start properly</h2>
  <p>Your stars and progress are safe. Tap below to restart.</p>
  <button onclick="location.replace(location.pathname.replace(/[^/]*$/,'')+'?restart='+Date.now())" style="width:100%;min-height:64px;font-size:1em;border-radius:16px;border:0;background:#0e5a57;color:#fff;font-weight:700">Restart the app</button>
  <button onclick="(window.__steadyRestart||function(){location.reload()})(true);(navigator.serviceWorker?navigator.serviceWorker.getRegistrations():Promise.resolve([])).then(function(r){r.forEach(function(x){x.unregister()})});if(window.caches)caches.keys().then(function(k){k.forEach(function(x){caches.delete(x)})});setTimeout(function(){location.replace(location.pathname.replace(/[^/]*$/,'')+'?repair='+Date.now())},800)" style="width:100%;min-height:56px;font-size:.9em;border-radius:16px;border:2px solid #0e5a57;background:#fff;color:#0e5a57;font-weight:700;margin-top:12px">Repair and restart</button>
</div>
<script>setTimeout(function(){if(!window.__steadyOK){var r=document.getElementById("rescue");if(r)r.hidden=false}},6000);</script>
